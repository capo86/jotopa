name: Verify invitation copy
on:
  push:
    branches: [group-invitation-copy-qa]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run build
      - run: npm test

